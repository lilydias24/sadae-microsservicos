version: '3.8'

services:
  # Gateway Principal - Ponto único de entrada para todos os microsserviços
  api-gateway:
    build: 
      context: .
      dockerfile: ./services/api-gateway/Dockerfile
    ports:
      - "8000:8000"  # Porta principal da aplicação SADAE
    environment:
      # URLs dos microsserviços para roteamento
      - AUTH_SERVICE_URL=http://auth-service:8001
      - MAINTENANCE_SERVICE_URL=http://maintenance-service:8003
    depends_on:
      - auth-service
      - maintenance-service
    networks:
      - sadae-network

  # Serviço de Autenticação e Autorização - Gerencia usuários, login e permissões
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    ports:
      - "8001:8001"  # Porta interna do serviço de autenticação
    environment:
      # Configuração do banco de dados do serviço de autenticação
      - DATABASE_URL=postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      # Configurações JWT para tokens de acesso
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
    depends_on:
      - auth-db
    networks:
      - sadae-network

  # Serviço de Manutenção - Gerencia ordens de serviço, equipes e equipamentos
  # Serviço de Manutenção - Gerencia ordens de serviço, equipes e equipamentos
  maintenance-service:
    build:
      context: .
      dockerfile: ./services/maintenance-service/Dockerfile
    ports:
      - "8003:8003"  # Porta interna do serviço de manutenção
    environment:
      # Configuração do banco de dados do serviço de manutenção
      - DATABASE_URL=postgresql://maintenance_user:maintenance_pass@maintenance-db:5432/maintenance_db
      # Configurações JWT para validação de tokens
      - JWT_SECRET=your-super-secret-jwt-key
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_HOURS=24
    depends_on:
      - maintenance-db
    networks:
      - sadae-network

  # Bancos de Dados - PostgreSQL para cada microsserviço
  # Banco de dados do serviço de autenticação
  auth-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_pass
    volumes:
      - auth_db_data:/var/lib/postgresql/data  # Persistência de dados
    networks:
      - sadae-network

  # Banco de dados do serviço de manutenção
  maintenance-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=maintenance_db
      - POSTGRES_USER=maintenance_user
      - POSTGRES_PASSWORD=maintenance_pass
    volumes:
      - maintenance_db_data:/var/lib/postgresql/data  # Persistência de dados
    networks:
      - sadae-network

  # Redis para cache e dados em tempo real
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"  # Porta padrão do Redis
    networks:
      - sadae-network

  # Aplicação Frontend - Interface web do sistema SADAE
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"  # Porta da aplicação React
    environment:
      # URL do API Gateway para comunicação backend
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - sadae-network

# Volumes para persistência de dados dos bancos
volumes:
  auth_db_data:      # Dados do banco de autenticação
  maintenance_db_data:  # Dados do banco de manutenção

# Rede interna para comunicação entre serviços
networks:
  sadae-network:
    driver: bridge
