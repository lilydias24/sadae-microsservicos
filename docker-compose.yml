version: "3.8"

services:
  # API Gateway
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
      - "3002:3002" # Adicione esta porta para WebSocket
    environment:
      - SUPPORT_SERVICE_URL=http://support-service:8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - WS_PORT=3002
    depends_on:
      - support-service
      - auth-service
    networks:
      - sadae-network

  # Support Service
  support-service:
    build:
      context: .
      dockerfile: ./services/support-service/Dockerfile
    ports:
      - "8006:8000"
    environment:
      - SUPPORT_DATABASE_URL=postgresql://support_user:support_pass@support-db:5432/support_db
    depends_on:
      - support-db
    networks:
      - sadae-network

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: ./services/auth-service/Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://auth_user:auth_pass@auth-db:5432/auth_db
      - JWT_SECRET=your-secret-key
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    depends_on:
      - auth-db
    networks:
      - sadae-network

  # Databases

  support-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=support_db
      - POSTGRES_USER=support_user
      - POSTGRES_PASSWORD=support_pass
    volumes:
      - support_db_data:/var/lib/postgresql/data
    networks:
      - sadae-network

  auth-db:
    image: postgres:15
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=auth_user
      - POSTGRES_PASSWORD=auth_pass
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - sadae-network

  # Redis for caching and real-time data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - sadae-network

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - api-gateway
    networks:
      - sadae-network

volumes:
  support_db_data:
  auth_db_data:

networks:
  sadae-network:
    driver: bridge
